<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Data Analysis with Excel — Complete Guide</title>
  <link rel="icon" type="image/x-icon" href="icon.png"> 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0fdf4;
      --deck-bg-1: #ffffff;
      --deck-bg-2: #f0fdf4;
      --surface: #ffffff;
      --surface-strong: rgba(22, 163, 74, .08);
      --border: rgba(22, 163, 74, .18);
      --border-strong: rgba(22, 163, 74, .35);
      --text: #1e293b;
      --text-dim: #334155;
      --text-faint: #16a34a;
      --accent: #16a34a;
      --accent-2: #15803d;
      --accent-bright: #166534;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --str: #86efac;
      --kw: #fcd34d;
      --fn: #93c5fd;
      --num: #fcd34d;
      --cm: #94a3b8;
      --ok: #16a34a;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }

    body {
      background: radial-gradient(1000px 600px at 90% -10%, rgba(22,163,74,.08), transparent 60%),
                  radial-gradient(800px 600px at -10% 110%, rgba(22,163,74,.06), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .deck {
      position: relative;
      width: min(95vw, 170vh);
      aspect-ratio: 16 / 9;
      background: linear-gradient(150deg, var(--deck-bg-1), var(--deck-bg-2));
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(22,163,74,.12), 0 0 0 1px rgba(255,255,255,.6) inset;
    }

    .deck:fullscreen {
      width: 100vw;
      aspect-ratio: auto;
      height: 100vh;
      border-radius: 0;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image: radial-gradient(rgba(22,163,74,.04) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: .4;
    }

    #slideMount {
      position: absolute;
      inset: 0;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 2;
    }

    #slideMount.is-leaving {
      opacity: 0;
      transform: translateY(4px);
    }
    #slideMount.is-entering {
      animation: slideIn .25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(18px, 3.2vw, 38px) clamp(22px, 4.5vw, 50px);
      z-index: 2;
      overflow-y: auto;
      color: var(--text);
    }

    .kicker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(6px, 1vw, 12px);
      flex-shrink: 0;
    }

    .slide-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: linear-gradient(150deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 18px rgba(22,163,74,.3);
      flex-shrink: 0;
    }

    .kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(10px, 1vw, 12.5px);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent-2);
    }

    h1.slide-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 2.6vw, 34px);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: clamp(4px, 0.8vw, 8px);
      color: var(--text);
      flex-shrink: 0;
    }

    .slide-subtitle {
      color: var(--text-dim);
      font-size: clamp(12px, 1.15vw, 15.5px);
      max-width: 72ch;
      margin-bottom: clamp(6px, 0.8vw, 10px);
      line-height: 1.5;
      flex-shrink: 0;
    }

    .slide-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      overflow-y: auto;
    }

    .code {
      background: var(--code-bg);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: clamp(10px, 1.3vw, 14px) clamp(12px, 1.8vw, 18px);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(11px, 1vw, 13.5px);
      line-height: 1.6;
      color: var(--code-text);
      overflow: auto;
      white-space: pre;
      box-shadow: 0 10px 20px rgba(22,163,74,.12);
      flex-shrink: 0;
      max-height: 42vh;
    }
    .code .str { color: var(--str); }
    .code .kw { color: var(--kw); }
    .code .fn { color: var(--fn); }
    .code .num { color: var(--num); }
    .code .cm { color: var(--cm); font-style: italic; }

    .note {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: #f0fdf4;
      border: 1.5px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: clamp(11px, 1vw, 14px);
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .note b { color: var(--accent-2); font-weight: 700; }

    .cols {
      display: grid;
      gap: 12px;
    }
    .cols-2 { grid-template-columns: 1fr 1fr; }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }

    .panel {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: clamp(10px, 1.3vw, 16px);
      box-shadow: 0 4px 12px rgba(22,163,74,.04);
    }
    .panel h4 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13.5px;
      margin-bottom: 6px;
      color: var(--accent-2);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .panel p, .panel li {
      color: var(--text-dim);
      font-size: clamp(11px, 0.95vw, 13px);
      line-height: 1.5;
    }
    .panel ul { padding-left: 18px; }
    .panel .cap {
      margin-top: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-faint);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      flex-shrink: 0;
    }
    .chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ffffff;
      border: 1.5px solid var(--border-strong);
      color: var(--accent-2);
      font-weight: 600;
    }

    .step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .step .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1.5px solid var(--border-strong);
      font-weight: 700;
      color: var(--accent-2);
    }
    .step p {
      color: var(--text-dim);
      font-size: clamp(11px, 1vw, 13.5px);
      line-height: 1.5;
      padding-top: 2px;
    }
    .step b { color: var(--text); }

    .title-hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      gap: 12px;
    }
    .title-hero .big-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: linear-gradient(150deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 30px rgba(22,163,74,.35);
    }
    .title-hero h1 { font-size: clamp(28px, 4.2vw, 44px); }

    .agenda-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 9px 15px;
    }
    .agenda-item .idx {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 700;
      width: 24px;
    }
    .agenda-item .txt b {
      display: block;
      font-size: 13px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
    }
    .agenda-item .txt span {
      font-size: 11px;
      color: var(--text-dim);
    }

    .practice-box {
      background: #f0fdf4;
      border: 1.5px dashed var(--border-strong);
      border-radius: 10px;
      padding: 12px 16px;
    }

    .badge {
      display: inline-flex;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
    }
    .badge.green { background: rgba(22,163,74,.12); color: #166534; }
    .badge.blue { background: rgba(37,99,235,.12); color: #1e40af; }
    .badge.amber { background: rgba(217,119,6,.12); color: #92400e; }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
    }
    .excel-table th {
      background: linear-gradient(120deg, rgba(22,163,74,.12), rgba(22,163,74,.05));
      padding: 5px 8px;
      text-align: left;
      font-weight: 700;
      color: var(--accent-2);
    }
    .excel-table td {
      padding: 4px 8px;
      border-top: 1px solid rgba(22,163,74,.06);
    }
    .excel-table tr:nth-child(even) { background: rgba(22,163,74,.015); }

    .chrome {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px clamp(12px, 2.2vw, 24px);
      z-index: 5;
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(4px);
      border-top: 1px solid var(--border);
    }
    .seg-bar {
      display: flex;
      gap: 4px;
      flex: 1;
    }
    .seg {
      height: 3px;
      border-radius: 4px;
      background: rgba(22,163,74,.08);
      flex: 1;
      transition: all .3s ease;
    }
    .seg.done { background: var(--accent-2); }
    .seg.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 6px rgba(22,163,74,.4);
    }
    .seg-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      min-width: 60px;
    }
    .counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .counter b { color: var(--accent-2); }

    .nav-btns {
      position: absolute;
      z-index: 6;
      top: 50%;
      transform: translateY(-50%);
    }
    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(5px);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s ease;
      box-shadow: 0 4px 12px rgba(22,163,74,.06);
    }
    .nav-btn:hover {
      background: rgba(22,163,74,.12);
      border-color: var(--border-strong);
      transform: scale(1.05);
    }
    .nav-btn:active { transform: scale(.95); }
    .nav-btn.disabled { opacity: .2; pointer-events: none; }
    .nav-left { left: 8px; }
    .nav-right { right: 8px; }

    .top-controls {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 6;
      display: flex;
      gap: 5px;
    }
    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--border);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      transition: all .2s ease;
    }
    .icon-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: rgba(22,163,74,.12);
    }

    .excel-fn {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(22,163,74,.08);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--accent-2);
      font-weight: 600;
      font-size: 11px;
    }

    @media (max-width: 720px) {
      .cols-2, .cols-3, .cols-4 { grid-template-columns: 1fr; }
      .seg-label { display: none; }
      .nav-btn { width: 26px; height: 26px; }
    }
  </style>
</head>
<body>
<div class="viewport">
  <div class="deck" id="deck">
    <div class="grain"></div>
    <div id="slideMount"></div>
    <div class="nav-btns nav-left"><button class="nav-btn" id="prevBtn" aria-label="Previous">‹</button></div>
    <div class="nav-btns nav-right"><button class="nav-btn" id="nextBtn" aria-label="Next">›</button></div>
    <div class="top-controls"><button class="icon-btn" id="fsBtn" title="Fullscreen">⤢</button></div>
    <div class="chrome">
      <div class="seg-label" id="segLabel">Start</div>
      <div class="seg-bar" id="segBar"></div>
      <div class="counter"><b id="curNum">01</b> / <span id="totalNum">22</span></div>
    </div>
  </div>
</div>

<script>
  (function() {
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function rcode(raw) {
      var s = esc(raw);
      s = s.replace(/(#.*$)/gm, '<span class="cm">$1</span>');
      s = s.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
      s = s.replace(/\b(TRUE|FALSE|NULL|NA|Inf|NaN)\b/g, '<span class="kw">$1</span>');
      s = s.replace(/\b(SUM|AVERAGE|COUNT|COUNTA|MAX|MIN|IF|VLOOKUP|HLOOKUP|INDEX|MATCH|ROUND|ROUNDUP|ROUNDDOWN|ABS|SQRT|POWER|LOG|EXP|DATE|DAY|MONTH|YEAR|TODAY|NOW|LEFT|RIGHT|MID|LEN|TRIM|CONCATENATE|FIND|SEARCH|SUBSTITUTE|UPPER|LOWER|PROPER|COUNTIF|SUMIF|AVERAGEIF|COUNTIFS|SUMIFS|AVERAGEIFS|PMT|FV|PV|RATE|NPER|CORREL|STDEV|STDEVP|VAR|VARP|MEDIAN|MODE|QUARTILE|PERCENTILE|RANK|LARGE|SMALL|FREQUENCY|TRANSPOSE|OFFSET|INDIRECT|ADDRESS|ROW|COLUMN|ROWS|COLUMNS|SUBTOTAL|AGGREGATE|FILTER|SORT|UNIQUE|SEQUENCE|RAND|RANDBETWEEN|XLOOKUP|XMATCH|LET|LAMBDA|ISNUMBER|ISTEXT|ISBLANK|ISERROR|IFERROR|IFNA|AND|OR|NOT|CHOOSE|SWITCH|TEXT|VALUE|NUMBERVALUE|ISOWEEKNUM|WEEKNUM|WORKDAY|NETWORKDAYS|EOMONTH|EDATE|DATEDIF|DAYS|DAYS360|TIME|HOUR|MINUTE|SECOND)\b/g, '<span class="fn">$1</span>');
      s = s.replace(/(?<![a-zA-Z_])(\d+\.?\d*)/g, '<span class="num">$1</span>');
      return '<div class="code">' + s + '</div>';
    }

    var SECTIONS = ["Intro", "Ask", "Collect", "Clean", "Explore", "Model", "Communicate", "Practice"];
    var slides = [
      // 0 - Welcome
      {
        section: 0, kicker: "EXCEL DATA ANALYSIS · COMPLETE GUIDE", icon: "📊", hero: true,
        title: "Data Analysis Fundamental",
        body: '<div class="title-hero"><div class="big-icon">📊</div><div><h1>Data Analysis with Excel</h1><p class="slide-subtitle" style="margin-top:6px;max-width:65ch;"><b>Turning raw data into actionable insights</b> — from asking the right questions to making data-driven decisions — all using Microsoft Excel.</p></div><div class="cols cols-4"><div style="text-align:center;"><span class="badge blue" style="font-size:12px;padding:5px 12px;">Ask</span></div><div style="text-align:center;"><span class="badge green" style="font-size:12px;padding:5px 12px;">Collect</span></div><div style="text-align:center;"><span class="badge amber" style="font-size:12px;padding:5px 12px;">Analyze</span></div><div style="text-align:center;"><span class="badge blue" style="font-size:12px;padding:5px 12px;">Present</span></div></div><div class="chip-row"><span class="chip">Excel Tables</span><span class="chip">Formulas</span><span class="chip">PivotTables</span><span class="chip">Charts</span><span class="chip">Power Query</span><span class="chip">Dashboard</span></div></div>'
      },
      // 1 - What is Data Analysis?
      {
        section: 0, kicker: "INTRODUCTION", icon: "🧭",
        title: "What is Data Analysis?",
        body: '<p class="slide-subtitle"><b style="color:var(--accent-bright)">Data analysis</b> is the process of inspecting, cleaning, transforming, and modeling data to discover useful information and support decision-making.</p><div class="cols cols-2"><div class="panel"><h4>🔍 Why Do It?</h4><ul><li>Support decision-making</li><li>Discover patterns and trends</li><li>Make predictions</li><li>Business intelligence</li><li>Improve efficiency</li></ul></div><div class="panel"><h4>📋 The 6-Step Process</h4><ol><li><b>Ask</b> — What do you want to know?</li><li><b>Collect</b> — Where is the data?</li><li><b>Clean</b> — Prepare the data</li><li><b>Explore</b> — Find patterns</li><li><b>Model</b> — Build relationships</li><li><b>Communicate</b> — Share results</li></ol></div></div><div class="note">📌 <b>Excel</b> is one of the most widely used tools for data analysis — accessible, powerful, and versatile.</div>'
      },
      // 2 - Ask Questions
      {
        section: 1, kicker: "STEP 1", icon: "❓",
        title: "1. Ask the Right Questions",
        body: '<p class="slide-subtitle">Everything starts with <b style="color:var(--accent-bright)">asking the right question</b>. A good question leads to a good analysis.</p><div class="cols cols-2"><div class="panel"><h4>❌ Bad Questions</h4><ul><li>"What does the data look like?"</li><li>"How are sales?"</li><li>"What is happening?"</li></ul></div><div class="panel"><h4>✅ Good Questions</h4><ul><li>"Which product category had the highest sales growth in Q3?"</li><li>"Which customer segment is most profitable?"</li><li>"How does seasonality affect sales?"</li></ul></div></div>' + rcode('# SMART Question Framework (Excel version)\n# Specific — clear and focused\n# Measurable — quantifiable with numbers\n# Achievable — feasible with available data\n# Relevant — important to the problem\n# Time-bound — has a timeline\n\n# Example:\n# "Which region had the highest revenue growth in 2024?"\n# You can answer this with Excel PivotTables!') + '<div class="note">📌 Your <b>research question</b> determines what data you need, which Excel tools to use, and how to interpret results.</div>'
      },
      // 3 - Collect Data
      {
        section: 2, kicker: "STEP 2", icon: "📥",
        title: "2. Collect Data",
        body: '<p class="slide-subtitle">Gather the <b style="color:var(--accent-bright)">necessary data</b> to answer your question.</p><div class="cols cols-3"><div class="panel"><h4>📁 Sources</h4><ul><li>CSV / Excel files</li><li>Text files (Tab-delimited)</li><li>Web (copy-paste)</li><li>Database exports</li><li>Power Query (Get & Transform)</li><li>External data connections</li></ul></div><div class="panel"><h4>📂 Import Methods</h4><ul><li><b>File → Open</b> (CSV, TXT)</li><li><b>Data → From Text/CSV</b></li><li><b>Data → From Web</b></li><li><b>Data → From Database</b></li><li><b>Copy-paste</b> from other sources</li></ul></div><div class="panel"><h4>⚖️ Ethics</h4><ul><li>User consent</li><li>Privacy protection</li><li>Data fairness</li><li>Bias checking</li><li>Compliance with laws</li></ul></div></div>' + rcode('# Excel Shortcuts for Data Import\n# Ctrl + O : Open file\n# Ctrl + C : Copy data\n# Ctrl + V : Paste data\n# Alt + D, B : From Text/CSV\n# Alt + D, W : From Web\n\n# Best Practice:\n# Always keep raw data in a separate sheet!\n# Name it "Raw_Data" or "Source"') + '<div class="note">📌 Always <b>document the source, collection method, and limitations</b> of your data in a separate sheet.</div>'
      },
      // 4 - Clean Data
      {
        section: 3, kicker: "STEP 3", icon: "🧹",
        title: "3. Clean Data (Data Cleaning)",

        body: '<div class="cols cols-2"><div class="panel"><h4>📘 Books</h4><ul><li><b>Excel Data Analysis for Dummies</b></li><li><b>Power Excel with MrExcel</b></li><li><b>Excel 2019 Power Programming</b></li></ul></div><div class="panel"><h4>🌐 Online</h4><ul><li>Microsoft Excel Help</li><li>ExcelJet.net</li><li>Chandoo.org</li><li>MrExcel.com</li><li>LinkedIn Learning / Coursera</li></ul></div></div><div class="cols cols-2"><div class="panel"><h4>🧑‍🏫 Community</h4><ul><li>r/excel (Reddit)</li><li>Excel User Groups</li><li>Stack Overflow (excel tag)</li><li>YouTube (ExcelIsFun)</li></ul></div><div class="panel"><h4>🛠️ Practice Data</h4><ul><li>Kaggle (export as CSV)</li><li>Data.gov</li><li>World Bank data</li><li>Make your own!</li></ul></div></div><div class="note">📌 Start with <b>small projects</b> — each project adds a new skill.</div>'
      },
      // 20 - Key Takeaways
      {
        section: 7, kicker: "REVIEW", icon: "🎯",
        title: "Key Takeaways",
        body: '<div class="steps"><div class="step"><div class="num">1</div><p><b>Ask:</b> Ask SMART questions — Specific, Measurable, Achievable, Relevant, Time-bound.</p></div><div class="step"><div class="num">2</div><p><b>Collect:</b> Import data from CSV, text files, web, or databases.</p></div><div class="step"><div class="num">3</div><p><b>Clean:</b> Remove blanks, duplicates, fix formatting — use <span class="excel-fn">TRIM()</span>, <span class="excel-fn">CLEAN()</span>, <span class="excel-fn">VALUE()</span>.</p></div><div class="step"><div class="num">4</div><p><b>Explore:</b> Use <b>PivotTables</b>, charts, and summary functions like <span class="excel-fn">AVERAGE()</span>, <span class="excel-fn">STDEV()</span>.</p></div><div class="step"><div class="num">5</div><p><b>Model:</b> Use <b>Regression</b> (Data Analysis Toolpak), <span class="excel-fn">FORECAST()</span>, and <span class="excel-fn">CORREL()</span>.</p></div><div class="step"><div class="num">6</div><p><b>Communicate:</b> Create dashboards with <b>PivotCharts</b>, <b>Slicers</b>, and clean formatting.</p></div></div>'
      },
      // 21 - Practice
      {
        section: 7, kicker: "PRACTICE", icon: "🚀",
        title: "Now You — Do It Yourself!",
        body: '<p class="slide-subtitle">Follow these steps to <b style="color:var(--accent-bright)">analyze your own dataset</b> in Excel.</p><div class="practice-box"><div style="font-weight:700;margin-bottom:8px;">📋 Mini-Project Ideas:</div><ul style="margin-bottom:12px;padding-left:18px;"><li>Your reading log → which month did you read the most? (Use PivotTable)</li><li>Gym workout data → which exercise burns the most calories? (Use AVERAGEIF)</li><li>Mobile data usage → which app uses the most data? (Use SUMIF + charts)</li><li>Online shopping → which day do you shop the most? (Use COUNTIF + bar chart)</li></ul>' + rcode('# Your turn — Excel version:\n# 1. Open Excel and create or import data\n# 2. Clean it: Remove duplicates (Data → Remove Duplicates)\n# 3. Create a PivotTable to summarize the data\n# 4. Add a chart to visualize the results\n# 5. Create a simple dashboard with slicers\n# 6. Save and share!') + '</div><div class="note">📌 <b>The best way to learn is by doing.</b> Start, make mistakes, learn, and try again.</div>'
      }
    ];

    var mount = document.getElementById('slideMount');
    var curNum = document.getElementById('curNum');
    var totalNum = document.getElementById('totalNum');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var fsBtn = document.getElementById('fsBtn');
    var deck = document.getElementById('deck');
    var segBar = document.getElementById('segBar');
    var segLabel = document.getElementById('segLabel');
    totalNum.textContent = slides.length;
    segBar.innerHTML = SECTIONS.map(function() { return '<div class="seg"></div>'; }).join('');
    var segEls = Array.from(segBar.children);
    var current = 0;

    function pad(n) {
      return (n + 1).toString().padStart(2, '0');
    }

    function renderSlide(i) {
      var s = slides[i];
      mount.innerHTML = '<div class="slide"><div class="kicker-row"><div class="slide-icon">' + s.icon + '</div><div class="kicker">' + s.kicker + '</div></div>' + (s.hero ? '' : '<h1 class="slide-title">' + s.title + '</h1>') + '<div class="slide-body">' + s.body + '</div></div>';
      curNum.textContent = pad(i);
      segLabel.textContent = SECTIONS[s.section];
      segEls.forEach(function(el, idx) {
        el.classList.toggle('done', idx < s.section);
        el.classList.toggle('active', idx === s.section);
      });
      prevBtn.classList.toggle('disabled', i === 0);
      nextBtn.classList.toggle('disabled', i === slides.length - 1);
    }

    function goTo(i) {
      if (i < 0 || i >= slides.length || i === current) return;
      current = i;
      mount.classList.add('is-leaving');
      setTimeout(function() {
        renderSlide(current);
        mount.classList.remove('is-leaving');
        mount.classList.add('is-entering');
        setTimeout(function() {
          mount.classList.remove('is-entering');
        }, 250);
      }, 160);
    }

    prevBtn.addEventListener('click', function() { goTo(current - 1); });
    nextBtn.addEventListener('click', function() { goTo(current + 1); });
    window.addEventListener('keydown', function(e) {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); goTo(current + 1); }
      if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); goTo(current - 1); }
      if (e.key === 'Home') goTo(0);
      if (e.key === 'End') goTo(slides.length - 1);
    });
    fsBtn.addEventListener('click', function() {
      if (!document.fullscreenElement) {
        deck.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });
    var touchX = null;
    deck.addEventListener('touchstart', function(e) {
      touchX = e.touches[0].clientX;
    });
    deck.addEventListener('touchend', function(e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if (dx > 40) goTo(current - 1);
      if (dx < -40) goTo(current + 1);
      touchX = null;
    });
    renderSlide(0);
  })();
</script>
</body>
</html>
